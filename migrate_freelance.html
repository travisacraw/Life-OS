<style>
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f3;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:20px;box-sizing:border-box;}
.card{background:#fff;border:0.5px solid #d1d1cf;border-radius:14px;padding:28px;width:580px;max-width:100%;}
h2{font-size:17px;font-weight:500;color:#2c2c2a;margin:0 0 6px;}
p{font-size:13px;color:#5f5e5a;margin:0 0 16px;line-height:1.5;}
.btn{padding:10px 20px;font-size:13px;border-radius:8px;border:none;background:#1D9E75;color:#fff;cursor:pointer;font-family:inherit;font-weight:500;width:100%;transition:background 0.1s;}
.btn:hover{background:#0F6E56;}
.btn:disabled{background:#b4b2a9;cursor:default;}
.log{margin-top:16px;background:#f5f5f3;border-radius:8px;padding:12px;font-size:11px;font-family:monospace;color:#5f5e5a;max-height:360px;overflow-y:auto;line-height:1.7;display:none;}
.progress{height:4px;background:#e8e8e4;border-radius:2px;margin-top:12px;overflow:hidden;}
.progress-fill{height:4px;background:#1D9E75;border-radius:2px;transition:width 0.3s;width:0%;}
.stat{display:inline-block;padding:2px 8px;border-radius:5px;background:#EAF3DE;color:#3B6D11;font-size:11px;font-weight:500;margin-right:6px;margin-bottom:6px;}
.stat.warn{background:#FAEEDA;color:#854F0B;}
</style>
</head>
<body>
<div class="card">
  <h2>Freelance company name cleanup</h2>
  <p>This migration updates 246 records in Supabase — stripping "Freelance" from company names, setting freelance status, and moving former company info into the known_from field.</p>
  <div style="margin-bottom:16px;">
    <span class="stat">246 records</span>
    <span class="stat warn">Clears company field</span>
    <span class="stat">Sets freelance status</span>
    <span class="stat">Moves ex. info to known_from</span>
  </div>
  <button class="btn" id="run-btn" onclick="runMigration()">Run migration</button>
  <div class="progress"><div class="progress-fill" id="prog"></div></div>
  <div class="log" id="log"></div>
</div>
<script>
const SUPABASE_URL = 'https://rjuizecfypondtneirwh.supabase.co';
const SUPABASE_KEY = 'sb_publishable_1wYT3FKXTlJlgjbH1TSOmg_uufdu17Q';

function log(msg, color){
  const el = document.getElementById('log');
  el.style.display = 'block';
  const d = document.createElement('div');
  d.style.color = color||'#5f5e5a';
  d.textContent = msg;
  el.appendChild(d);
  el.scrollTop = el.scrollHeight;
}
function setProgress(p){ document.getElementById('prog').style.width=p+'%'; }

async function runMigration(){
  const btn = document.getElementById('run-btn');
  btn.disabled = true; btn.textContent = 'Running...';

  // Load all people from Supabase
  log('Loading people from Supabase...');
  const res = await fetch(`${SUPABASE_URL}/rest/v1/work_os_people?select=id,name,email,company,freelance_status,known_from,known_from_is_former&limit=1000`,{
    headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY}
  });
  const people = await res.json();
  log(`Loaded ${people.length} records`);

  // Build lookup map from migration data
  const migMap = {};
  MIGRATION_DATA.forEach(m => {
    const key = (m.name||'').toLowerCase().trim() + '|' + (m.email||'').toLowerCase().trim();
    migMap[key] = m;
  });

  // Find records that need updating
  const toUpdate = [];
  for(const p of people){
    const company = (p.company||'').trim().toLowerCase();
    if(!company.includes('freelance') && !company.startsWith('exp - free')) continue;
    const key = (p.name||'').toLowerCase().trim() + '|' + (p.email||'').toLowerCase().trim();
    const mig = migMap[key];
    toUpdate.push({
      id: p.id,
      name: p.name,
      company: null,
      freelance_status: 'Currently freelance',
      known_from: mig?.known_from || p.known_from || null,
      known_from_is_former: mig?.known_from_is_former || false,
    });
  }

  log(`Found ${toUpdate.length} records to update`);

  let done = 0, errors = 0;
  for(const rec of toUpdate){
    try{
      const r = await fetch(`${SUPABASE_URL}/rest/v1/work_os_people?id=eq.${rec.id}`,{
        method:'PATCH',
        headers:{
          'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,
          'Content-Type':'application/json','Prefer':'return=minimal'
        },
        body: JSON.stringify({
          company: rec.company,
          freelance_status: rec.freelance_status,
          known_from: rec.known_from,
          known_from_is_former: rec.known_from_is_former,
        })
      });
      if(!r.ok) throw new Error('HTTP '+r.status);
      done++;
      if(done % 20 === 0) log(`Updated ${done}/${toUpdate.length}...`, '#1D9E75');
    }catch(e){
      log(`Error on ${rec.name}: ${e.message}`, '#E24B4A');
      errors++;
    }
    setProgress(Math.round((done+errors)/toUpdate.length*100));
    await new Promise(r=>setTimeout(r,50));
  }

  setProgress(100);
  log(`\nDone. Updated: ${done}  Errors: ${errors}`, '#2c2c2a');
  btn.textContent = errors===0?'Migration complete!':'Done with '+errors+' errors';
  if(errors===0) setTimeout(()=>{ window.location.href='index.html'; }, 2000);
}
</script>
